onboarding = false

[theme]
name = "terminal"
auto_switch = false

[theme.custom]
selection_bg = "blue"

[keys]
prefix = "ctrl+q"
switch_workspace = "prefix+1..9"
switch_tab = "prefix+shift+1..9"
previous_tab = ["prefix+p", "f9"]
next_tab = ["prefix+n", "f10"]
previous_workspace = "f11"
next_workspace = "f12"
previous_agent = ["prefix+a", "f7"]
next_agent = "f8"
navigate_workspace_up = "up"
navigate_workspace_down = "down"

[ui]
agent_panel_sort = "priority"
window_title = "herdr · {terminal_title}"

[ui.toast]
delivery = "herdr"

[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", "agent", "$model"],
  ["terminal_title_stripped"],
]
